name: Build EooN Mobile (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le build manuellement sur GitHub

jobs:
  # ==========================================
  # 1. COMPILATION ANDROID (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Installation des dépendances
        run: |
          cd eoon_app
          flutter pub get

      - name: Compilation de l'APK Release
        run: |
          cd eoon_app
          flutter build apk --release --split-per-abi

      - name: Export de l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: eoon-android-apk
          path: eoon_app/build/app/outputs/flutter-apk/*.apk

  # ==========================================
  # 2. COMPILATION iOS (Runner macOS)
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Installation des dépendances Flutter
        run: |
          cd eoon_app
          flutter pub get

      - name: Compilation iOS (Sans signature / No Codesign)
        run: |
          cd eoon_app
          flutter build ios --release --no-codesign

      - name: Compression du build iOS
        run: |
          cd eoon_app/build/ios/iphoneos
          zip -r eoon_ios_runner.zip Runner.app

      - name: Export du build iOS (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: eoon-ios-app
          path: eoon_app/build/ios/iphoneos/eoon_ios_runner.zip
